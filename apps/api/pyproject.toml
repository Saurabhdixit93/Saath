[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "saath-api"
version = "0.1.0"
description = "Saath backend API and Arq workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.14.0,<2.0",
    "redis[hiredis]>=5.2.0,<6.0",
    "arq>=0.26.1,<1.0",
    "httpx>=0.27.2,<1.0",
    "pyjwt[crypto]>=2.10.0,<3.0",
    "cryptography>=43.0.3,<45.0",
    "argon2-cffi>=23.1.0,<26.0",
    "pyyaml>=6.0.2,<7.0",
    "structlog>=24.4.0,<26.0",
    "ortools>=9.11.4210,<10.0",
    "pillow>=11.0.0,<12.0",
    "qrcode>=8.0,<9.0",
    "pywebpush>=2.0.0,<3.0",
    "anthropic>=0.42.0,<1.0",
    "opentelemetry-api>=1.28.0,<2.0",
    "opentelemetry-sdk>=1.28.0,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<1.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0,<1.0",
    "opentelemetry-instrumentation-redis>=0.49b0,<1.0",
    "opentelemetry-exporter-otlp>=1.28.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
    "fakeredis>=2.26.0",
    "hypothesis>=6.118.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/saath_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "alembic", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["saath_api"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = [
    "arq.*",
    "opentelemetry.instrumentation.*",
    "ortools.*",
    "pywebpush.*",
    "qrcode.*",
]
ignore_missing_imports = true
