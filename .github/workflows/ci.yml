name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saath
          POSTGRES_PASSWORD: saath
          POSTGRES_DB: saath
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync
      - name: Lint & Typecheck API
        working-directory: apps/api
        run: |
          uv run ruff check .
          uv run mypy --strict src
      - name: Run Migrations & Pytest
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://saath:saath@127.0.0.1:5432/saath
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          uv run alembic upgrade head
          uv run pytest -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Lint, Typecheck, Test & Build
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose & Build Images
        run: |
          docker compose config
          docker compose build api web admin
