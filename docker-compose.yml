services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saath}
      POSTGRES_DB: ${POSTGRES_DB:-saath}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - saath_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saath} -d ${POSTGRES_DB:-saath}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - saath_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+asyncpg://saath:saath@postgres:5432/saath}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      ENV: ${ENV:-development}
      TURNSTILE_MODE: ${TURNSTILE_MODE:-fake}
      WHATSAPP_MODE: ${WHATSAPP_MODE:-fake}
      SMS_MODE: ${SMS_MODE:-fake}
    ports:
      - "${API_PORT:-8100}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn saath_api.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+asyncpg://saath:saath@postgres:5432/saath}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      ENV: ${ENV:-development}
      RAIL_PROVIDER_MODE: ${RAIL_PROVIDER_MODE:-fake}
      WHATSAPP_MODE: ${WHATSAPP_MODE:-fake}
      SMS_MODE: ${SMS_MODE:-fake}
      PUSH_MODE: ${PUSH_MODE:-fake}
      AI_MODE: ${AI_MODE:-fake}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["arq", "saath_api.worker.WorkerSettings"]

  scheduler:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+asyncpg://saath:saath@postgres:5432/saath}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      ENV: ${ENV:-development}
      RAIL_PROVIDER_MODE: ${RAIL_PROVIDER_MODE:-fake}
      WHATSAPP_MODE: ${WHATSAPP_MODE:-fake}
      SMS_MODE: ${SMS_MODE:-fake}
      PUSH_MODE: ${PUSH_MODE:-fake}
      AI_MODE: ${AI_MODE:-fake}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["arq", "saath_api.worker.SchedulerSettings"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8100}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8100/v1/ws}
      NEXT_PUBLIC_TURNSTILE_MODE: ${NEXT_PUBLIC_TURNSTILE_MODE:-fake}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3100}
    ports:
      - "${WEB_PORT:-3100}:3000"
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8100}
      NEXT_PUBLIC_ADMIN_SSO_ENABLED: ${NEXT_PUBLIC_ADMIN_SSO_ENABLED:-false}
    ports:
      - "${ADMIN_PORT:-3101}:3001"
    depends_on:
      api:
        condition: service_healthy

volumes:
  saath_pgdata:
  saath_redisdata:
